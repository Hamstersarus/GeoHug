<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoHug</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="setup-screen">
        <h1>GeoHug</h1>
        <div id="preset-box">
            <select id="preset-select"></select>
            <button id="preset-add-btn">Add to list</button>
            <button id="preset-replace-btn">Replace list</button>
            <button id="clear-btn">Clear list</button>
        </div>
        <input type="text" id="country-input" placeholder="Enter a country" list="country-options">
        <datalist id="country-options"></datalist>
        <button id="add-btn">Add</button>
        <p id="error-msg"></p>
        <ul id="country-list"></ul>
        <button id="start-btn">Start quiz</button>
    </section>

    <section id="quiz-screen" class="hidden">
        <p id="prompt"></p>
        <p id="score"></p>
        <svg id="map"></svg>
    </section>

    <section id="result-screen" class="hidden">
        <p id="final-score"></p>
        <button id="restart-btn">Restart</button>
        <button id="retry-btn" class="hidden">Retry missed countries</button>
        <button id="retry-btn" class="hidden">Retry missed countries</button>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="app.js"></script>
</body>
</html>
